name: Mantener Supabase activo

# El plan gratuito pausa el proyecto tras 7 días sin actividad. Cada 3 días se consulta la base.
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base (RPC keepalive, no lee datos)
        env:
          # Llave PUBLICABLE (la misma que usa el navegador). Nunca la de servicio.
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://hnlhhwululasvlckbcrq.supabase.co' }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_-3SmtEtO1brhGbThaJeICw_OPugVcG9' }}
        run: |
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" -d '{}'

  reactivar:
    # GitHub desactiva los workflows programados tras 60 días sin commits; esto lo evita.
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
