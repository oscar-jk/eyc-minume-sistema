          VITE_SUPABASE_URL: https://hnlhhwululasvlckbcrq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_-3SmtEtO1brhGbThaJeICw_OPugVcG9
      - name: Ninguna llave de servicio en el bundle
        run: "! grep -rIl 'service_role' dist"
